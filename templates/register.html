<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management|login form</title>
  <style>
 @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@200;300;400;500;600;700&display=swap");

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Open Sans", sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  width: 100%;
  padding: 0 10px;
}

body.light {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background:url("https://i.pinimg.com/736x/f5/77/c3/f577c3882823d9912123def561294559.jpg");
  background-position: center;
  background-size: cover;
}

body.light .wrapper {
  width: 400px;
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  border: 1px solid rgba(16, 15, 15, 0.5);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
}

form {
  display: flex;
  flex-direction: column;
}
body.light h2 {
  font-size: 2rem;
  margin-bottom: 20px;
  color: #080808;
}

body.light .input-field {
  position: relative;
  border-bottom: 2px solid #020202;
  margin: 15px 0;
}

body.light .input-field label {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  color: #151515;
  font-size: 16px;
  pointer-events: none;
  transition: 0.15s ease;
}

body.light .input-field input {
  width: 100%;
  height: 40px;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: #0d0d0d;
}

body.light .input-field input:focus~label,
body.light .input-field input:valid~label {
  font-size: 0.8rem;
  top: 10px;
  transform: translateY(-120%);
}

body.light .wrapper a {
  color: #040404;
  text-decoration: none;
}

body.light .wrapper a:hover {
  text-decoration: underline;
}

body.light button {
  background: #131313;
  color: #ccc;
  font-weight: 600;
  border: none;
  padding: 12px 20px;
  padding-left:50px;
  padding-right:50px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 16px;
  border: 2px solid transparent;
  transition: 0.3s ease;
}

body.light button:hover {
  color: #111111;
  border-color: #191919ca;
  background: rgba(255, 255, 255, 0.15);
}

body.light .login {
  text-align: center;
  margin-top: 30px;
  color: #0b0b0b;
}
body.dark {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background:url("https://i.pinimg.com/736x/90/c6/e5/90c6e50957bb3c597a79f984e7db3ac9.jpg");
  background-position: center;
  background-size: cover;
}
body.dark .wrapper {
  width: 400px;
  border-radius: 8px;
  padding: 30px;
  text-align: center;
  border: 1px solid rgba(253, 247, 247, 0.5);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
}

body.dark h2 {
  font-size: 2rem;
  margin-bottom: 20px;
  color: #f3eeee;
}

body.dark .input-field {
  position: relative;
  border-bottom: 2px solid #ccc;
  margin: 15px 0;
}

body.dark .input-field label {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  color: #ccc;
  font-size: 16px;
  pointer-events: none;
  transition: 0.15s ease;
}

body.dark .input-field input {
  width: 100%;
  height: 40px;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  color: #ccc;
}
body.dark .input-field input:focus~label,
body.dark .input-field input:valid~label {
  font-size: 0.8rem;
  top: 10px;
  transform: translateY(-120%);
}

body.dark .wrapper a {
  color: #ccc;
  text-decoration: none;
}

body.dark .wrapper a:hover {
  text-decoration: underline;
}

body.dark button{
   background: #ccc;
  color: #0c0c0c;
  font-weight: 600;
  border: none;
  padding: 12px 20px;
  padding-left:50px;
  padding-right:50px;
  cursor: pointer;
  border-radius: 3px;
  font-size: 16px;
  border: 2px solid transparent;
  transition: 0.3s ease;
}

body.dark button:hover {
  color: #111111;
  border-color: #191919ca;
  background: rgba(255, 255, 255, 0.15);
}
body.dark .login {
  text-align: center;
  margin-top: 30px;
  color: #ccc;
}
.theme-buttons a{
  margin-top:0px;
  left-padding:45px;
  right-padding:45px;
}
 @media (max-width: 500px) {

.login-container {
    width: 95%;
  padding: 25px;
}

h2 {
 font-size: 24px;
}
.button-group {
flex-direction: column;
}
}
  </style>
</head>
<body class="{{ theme }}">
  <div class="wrapper">
     <div class="theme-buttons">

            <a href="/set-theme/light">
                 ☀ Light
            </a>

            <a href="/set-theme/dark">
                ⏾Dark
            </a>

        </div>
        <h2>Register Form</h2>
    <form action="/register"
            method="POST"
            id="registrationForm">

        <div class="input-field">
        <input type="text" name="fullname" required>
        <label>Enter your Fullname</label>
        </div>
        <div class="input-field">
        <input type="text" name="username" required>
        <label>Enter your username</label>
        </div>
      <div class="input-field">
        <input type="password" name="password" required>
        <label>Enter your password</label>
      </div>
        <div class="button-group">
      <button class="register" type="submit" value="Register">Register</button>
       <button type="button"
                        class="reset-btn"
                        onclick="resetForm()">

                    Reset

                </button>
        </div>
      <div class="login">
        <p>Already have an account? <a href="/login">login</a></p>
      </div>
    </form>
  </div>
   <script>

        function resetForm() {

            document
                .getElementById("registrationForm")
                .reset();

        }
      </script>
</body>
</html>
